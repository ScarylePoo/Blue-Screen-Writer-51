name: Build and test

# Every push and pull request: build and run the tests on Windows, Linux
# and macOS.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
          - os: ubuntu-22.04
            toolchain: stable
          - os: macos-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux libraries (X11, Wayland, keyboard)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal
          rustup default ${{ matrix.toolchain }}
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release
