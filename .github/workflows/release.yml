name: Release

# Build and publish a release when a tag like v1.2.0 is pushed — also when the
# release is created on the GitHub website (that creates the tag; the files
# are then attached to it).  Or start it by hand from the Actions tab and give
# the version (e.g. 1.2.0).
#
# Packages: Windows (zip), Linux x64 (tar.gz), macOS universal app (zip).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v (e.g. 1.2.0)"
        required: true
      dry_run:
        description: "Only build the packages (download them from the run), do not publish"
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          $v = "$env:VERSION".TrimStart("v")
          "V=$v" >> $env:GITHUB_ENV
          # put the version into the program (shown in Explorer -> Properties)
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version = ".*"', "version = `"$v`"" | Set-Content Cargo.toml -NoNewline

      - name: Rust (x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          rustc -vV

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          $dir = "pkg\Blue Screen Writer 51"
          New-Item -ItemType Directory -Force $dir, "$dir\WPM" | Out-Null
          Copy-Item target\release\bsw51.exe $dir
          Copy-Item -Recurse assets\dict, assets\thes, assets\hyph $dir
          Copy-Item assets\fonts\DejaVu-LICENSE.txt $dir
          Copy-Item LICENSE "$dir\LICENSE.txt"
          Copy-Item packaging\README.txt "$dir\READ ME.txt"
          "Put your own macros (.WPM) and keyboard files (.WPK) in this folder." | Set-Content "$dir\WPM\README.txt"

          # the guide for 5.1 users as a Word document, converted by the program itself
          $tmp = Join-Path $env:RUNNER_TEMP guide
          New-Item -ItemType Directory -Force $tmp, "$tmp\cfg" | Out-Null
          Copy-Item docs\GUIDE.md $tmp
          # Start-Process -Wait: PowerShell does not wait for a windowed
          # program on its own; the keys need their quotes escaped
          Start-Process -FilePath "$env:GITHUB_WORKSPACE\target\release\bsw51.exe" -WorkingDirectory $tmp -Wait -ArgumentList '--config', "`"$tmp\cfg`"", 'GUIDE.md', '--keys', '"{Ctrl-F5}\"31\"{Enter}"'
          if (Test-Path "$tmp\GUIDE.docx") {
            Copy-Item "$tmp\GUIDE.docx" "$dir\Guide - What Is New.docx"
          } else {
            Write-Warning "guide conversion failed; shipping the Markdown version"
            Copy-Item docs\GUIDE.md "$dir\Guide - What Is New.md"
          }
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path $dir -DestinationPath "out\BlueScreenWriter51-$env:V-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    # Ubuntu 22.04: the program then runs on glibc 2.35 and newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          v="${VERSION#v}"
          echo "V=$v" >> "$GITHUB_ENV"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml

      - name: Linux libraries (X11, Wayland, keyboard)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev libxcursor-dev

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          dir="pkg/Blue Screen Writer 51"
          mkdir -p "$dir/WPM"
          cp target/release/bsw51 "$dir/"
          strip "$dir/bsw51"
          cp -r assets/dict assets/thes assets/hyph "$dir/"
          cp assets/fonts/DejaVu-LICENSE.txt "$dir/"
          cp LICENSE "$dir/LICENSE.txt"
          cp packaging/README-linux.txt "$dir/READ ME.txt"
          cp packaging/bsw51.desktop "$dir/"
          cp assets/bsw51-1024.png "$dir/bsw51.png"
          echo "Put your own macros (.WPM) and keyboard files (.WPK) in this folder." > "$dir/WPM/README.txt"
          tmp="$RUNNER_TEMP/guide"; mkdir -p "$tmp/cfg"; cp docs/GUIDE.md "$tmp/"
          (cd "$tmp" && "$GITHUB_WORKSPACE/target/release/bsw51" --config "$tmp/cfg" GUIDE.md --keys '{Ctrl-F5}"31"{Enter}') || true
          if [ -f "$tmp/GUIDE.docx" ]; then cp "$tmp/GUIDE.docx" "$dir/Guide - What Is New.docx"; else cp docs/GUIDE.md "$dir/Guide - What Is New.md"; fi
          mkdir -p out
          tar -C pkg -czf "out/BlueScreenWriter51-$V-linux-x64.tar.gz" "Blue Screen Writer 51"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          v="${VERSION#v}"
          echo "V=$v" >> "$GITHUB_ENV"
          sed -i '' "1,/^version = \".*\"/s/^version = \".*\"/version = \"$v\"/" Cargo.toml

      - name: Rust (Apple Silicon and Intel)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build (universal)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output bsw51 target/aarch64-apple-darwin/release/bsw51 target/x86_64-apple-darwin/release/bsw51
          lipo -info bsw51

      - name: Package
        run: |
          app="pkg/Blue Screen Writer 51/Blue Screen Writer 51.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp bsw51 "$app/Contents/MacOS/bsw51"
          cp -r assets/dict assets/thes assets/hyph "$app/Contents/Resources/"
          # icon
          set="$RUNNER_TEMP/bsw51.iconset"; mkdir -p "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/bsw51-1024.png --out "$set/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d assets/bsw51-1024.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/bsw51.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Blue Screen Writer 51</string>
            <key>CFBundleDisplayName</key><string>Blue Screen Writer 51</string>
            <key>CFBundleIdentifier</key><string>io.github.scarylepoo.bsw51</string>
            <key>CFBundleExecutable</key><string>bsw51</string>
            <key>CFBundleIconFile</key><string>bsw51</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$V</string>
            <key>CFBundleVersion</key><string>$V</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          # ad-hoc signature (required to run on Apple Silicon)
          codesign --force --deep --sign - "$app"
          cp packaging/README-macos.txt "pkg/Blue Screen Writer 51/READ ME.txt"
          cp LICENSE "pkg/Blue Screen Writer 51/LICENSE.txt"
          tmp="$RUNNER_TEMP/guide"; mkdir -p "$tmp/cfg"; cp docs/GUIDE.md "$tmp/"
          (cd "$tmp" && "$GITHUB_WORKSPACE/bsw51" --config "$tmp/cfg" GUIDE.md --keys '{Ctrl-F5}"31"{Enter}') || true
          if [ -f "$tmp/GUIDE.docx" ]; then cp "$tmp/GUIDE.docx" "pkg/Blue Screen Writer 51/Guide - What Is New.docx"; else cp docs/GUIDE.md "pkg/Blue Screen Writer 51/Guide - What Is New.md"; fi
          mkdir -p out
          (cd pkg && ditto -c -k --sequesterRsrc --keepParent "Blue Screen Writer 51" "../out/BlueScreenWriter51-$V-macos-universal.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  publish:
    needs: [windows, linux, macos]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${VERSION#v}"
          ls -l out
          notes="Downloads: **Windows** (zip: unzip and double-click bsw51.exe), **Linux** x64 (tar.gz: unpack and run ./bsw51), **macOS** Apple Silicon and Intel (zip with the app; the first time right-click it and choose Open). Each package has a READ ME. New to the extras? Open *Guide - What Is New.docx*. Full manual: https://github.com/${GH_REPO}/wiki"
          # a release made on the website already exists (that created the tag):
          # just attach the files to it; otherwise create the release
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" out/* --clobber
          else
            gh release create "v$v" out/* --title "Blue Screen Writer 51 $v" --notes "$notes" --target "${{ github.sha }}"
          fi
