[package]
name = "bsw51"
version = "1.0.0"
edition = "2024"
description = "Blue Screen Writer 51 - a native word processor with the WordPerfect 5.1 for DOS experience"

[dependencies]
aes = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fontdue = "0.9"
quick-xml = "0.37"
sha1 = "0.10"
sha2 = "0.10"
spellbook = "0.4"
unicode-bidi = "0.3"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

[target.'cfg(not(windows))'.dependencies]
softbuffer = { version = "0.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", features = ["x11", "wayland"] }
softbuffer = { version = "0.4", features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
